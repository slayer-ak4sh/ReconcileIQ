name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconcileiq
          POSTGRES_PASSWORD: reconcileiq_secret
          POSTGRES_DB: reconcileiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: cd backend && mvn -B clean package -DskipTests

      - name: Run Tests
        run: cd backend && mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/reconcileiq
          SPRING_DATASOURCE_USERNAME: reconcileiq
          SPRING_DATASOURCE_PASSWORD: reconcileiq_secret

  build-test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test -- --run

      - name: Build
        run: cd frontend && npm run build

  benchmark-nightly:
    runs-on: ubuntu-latest
    on:
      schedule:
        - cron: '0 2 * * 0'  # Weekly at 2 AM Sunday
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconcileiq
          POSTGRES_PASSWORD: reconcileiq_secret
          POSTGRES_DB: reconcileiq
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Generate large dataset
        run: python3 scripts/seed_generator.py

      - name: Build
        run: cd backend && mvn -B clean package -DskipTests

      - name: Run benchmark
        run: |
          echo "Benchmark runs would be logged here"