version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reconcileiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reconcileiq
      POSTGRES_USER: reconcileiq
      POSTGRES_PASSWORD: reconcileiq_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcileiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reconcileiq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reconcileiq
      SPRING_DATASOURCE_USERNAME: reconcileiq
      SPRING_DATASOURCE_PASSWORD: reconcileiq_secret
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reconcileiq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:http://localhost:8080/api/v1}
    ports:
      - "5173:80"

volumes:
  postgres_data:
